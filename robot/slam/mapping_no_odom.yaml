# =====================================================================
#  slam_toolbox の設定 ― 車輪オドメトリ「なし」の地図づくり用（調整版）
#
#  いつもの手順（窓② が ~/bringup/temp_tf_launch.py の「動かない仮の TF」）のまま使えます。
#  Pi の ~/slam/temp_mapping.yaml（slam_toolbox の標準 ＋ minimum_travel_* を 0 にしたもの）から、
#  ★印の 3 か所だけを変えています。2026-09-21、約 2 m 四方のスペースで壁が二重・三重に写り、
#  手前にできたにせの障害物のせいで Nav2 が経路を作れなかったための調整です。
#
#  使い方（窓③）:
#    ros2 launch slam_toolbox online_async_launch.py use_sim_time:=false \
#        slam_params_file:=$HOME/moving-bookshelf-app/robot/slam/mapping_no_odom.yaml
#
#  ★実機では未検証★ 良くなったか・悪くなったかを、同じ場所で作った地図で見比べてください
#  （python3 map_check.py の「ピンを置ける広さ」が目安になります）。
#  根本の対策は、車輪オドメトリを使う mapping_odom.yaml のほうです。
# =====================================================================
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.0
    max_laser_range: 12.0
    # ★0.5 → 0.2★ スキャンを取り込む間隔 [s]。オドメトリが無いので、前のスキャンからの動きは
    #   「形の重ね合わせ」だけで探します。0.5 秒あくと、回転中は 13〜26° も向きが変わり、
    #   探す範囲（±20°）のぎりぎりか外になります。間隔を詰めて 1 回あたりの動きを小さくします。
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # 仮の TF は「動いていない」と言い続けるので、0 にしないとスキャンが 1 枚も取り込まれません
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    check_min_dist_and_heading_precisely: false
    # ★10 → 30★ 重ね合わせの相手にする「直近のスキャン」の枚数。0.2 秒間隔 × 30 枚 ＝ 約 6 秒ぶん。
    #   少ないと、見覚えのある壁に戻ってきたときに昔のスキャンと照合されず、少しずれた位置に
    #   もう 1 本の線が描かれます。
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    # ★0.1 → 0.25★ 「レーザーが通った回数のうち、当たった回数がこの割合を超えたマス」を障害物にします。
    #   0.1 だと 1 割当たっただけで障害物になり、ずれて描かれた線（本物の壁の手前のにせの線）が全部残ります。
    #   本物の壁はほぼ毎回当たるので残ります。上げすぎると壁に穴があくので、0.25 から。
    occupancy_threshold: 0.25
